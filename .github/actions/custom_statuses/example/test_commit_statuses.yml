name: Custom check setting

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb #v6
        with:
          cache: true

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --verbose
        env:
          NEXT_PUBLIC_GRAPHQL_API_URL: ${{ secrets.NEXT_PUBLIC_GRAPHQL_API_URL }}

      - uses: ./.github/actions/custom_statuses
        with:
          description: fake status 1
          state: success
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/custom_statuses
        with:
          description: fake status 2
          state: failure
          github_token: ${{ secrets.GITHUB_TOKEN }}
